# The backend, frontend, types, and e2e jobs are duplicated into release.yml
# (a tag push triggers no CI run, so the release re-runs the gate itself).
# When editing those jobs here, mirror the change there by hand.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npx eslint .

      - name: Type check
        run: npx tsc -b --force

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

  # The drift gate: regenerate the TypeScript types and fail on any change,
  # including brand-new untracked outputs a bare `git diff` misses.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sync dependencies
        run: uv sync --locked

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Regenerate types
        run: uv run scripts/generate_types.py

      - name: Fail on drift
        run: |
          status=$(git status --porcelain -- frontend/src/types/generated)
          if [ -n "$status" ]; then
            echo "generated types are out of date; run: uv run scripts/generate_types.py"
            echo "$status"
            git diff -- frontend/src/types/generated
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sync dependencies
        run: uv sync --locked

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Type check the specs
        run: npx tsc -p ../tests/e2e
        working-directory: frontend

      - name: Run the smoke
        run: npx playwright test --project=e2e
        working-directory: frontend

  # The screenshot gate: the capture harness must still be able to reach every
  # documented state. It does not compare pixels — the app uses system font stacks,
  # so a macOS capture and this runner's rendering differ in every text-bearing
  # shot. What fails here is structural: a renamed control, a restructured panel, a
  # state that no longer reaches the screen, or a shot whose test was deleted or
  # skipped. The fresh capture is uploaded so a reviewer can eyeball it.
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sync dependencies
        run: uv sync --locked

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Type check the capture specs
        run: npx tsc -p ../tests/screenshots
        working-directory: frontend

      - name: Capture every shot
        run: npm run shots
        working-directory: frontend

      - name: Check the captured set against the docs
        run: uv run python scripts/check_screenshots.py --produced frontend/test-results/produced-shots.txt

      - name: Upload the fresh capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/assets/screenshots

  # A docs build is platform-independent, so this job runs on ubuntu only; the
  # pytest matrix above covers both OSes.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Check the screenshots
        run: uv run python scripts/check_screenshots.py

      - name: Build the site
        run: uv run mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Deployment uses the Pages artifact actions, so no gh-pages branch ever
  # exists. One-time repository setup: set the Pages source to "GitHub Actions".
  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
