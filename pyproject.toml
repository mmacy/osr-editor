[project]
name = "osr-editor"
version = "0.1.0"
description = "Local GUI editor for creating and modifying osrlib adventure modules."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marsh Macy" }]
requires-python = ">=3.14"
keywords = [
    "bx",
    "osr",
    "ttrpg",
    "adventure-module",
    "dungeon",
    "editor",
    "osrlib",
    "old-school-essentials",
]
# Python :: 3.14 only — the version CI tests (the family rule); no License ::
# classifier beside the SPDX expression, per PEP 639.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Typing :: Typed",
]
dependencies = [
    "osrlib>=1.4,<2",
    "osr-forge>=0.1,<0.2",
    "pydantic>=2",
    "pyyaml>=6",
    "fastapi>=0.139",
    "uvicorn>=0.51",
    "platformdirs>=4",
]

[project.scripts]
osr-editor = "osreditor.app:main"

# The geometry importer seam: each entry is a zero-arg callable returning a
# GeometryImporter instance. The built-in converters register through the same
# public group any third-party converter uses — dogfooding the seam keeps the
# protocol honest. A format ships bundled when it is broadly useful,
# permissively licensed, and parseable with no new dependency; everything else
# is a separate installable package, and the group stays public either way.
[project.entry-points."osreditor.importers"]
project = "osreditor.importers.project:ProjectImporter"
watabou-opd = "osreditor.importers.watabou:OPDImporter"

[project.urls]
Repository = "https://github.com/mmacy/osr-editor"
Documentation = "https://mmacy.github.io/osr-editor/"
Issues = "https://github.com/mmacy/osr-editor/issues"
Changelog = "https://github.com/mmacy/osr-editor/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "pyright>=1.1",
    "httpx2>=2.7.0",
    "types-pyyaml>=6",
    { include-group = "docs" },
]
# The documentation site's toolchain; included by dev so `uv sync` stays one
# command. No mkdocs-gen-files or mkdocs-literate-nav: the editor's reference
# surface is one seam, not a generated per-module tree, so the nav is
# hand-written — which also sidesteps the properdocs hazard osrlib pins
# against (both plugins' next releases depend on an unvetted mkdocs fork).
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
]

# osrlib 1.4.0 (the content_pack release) has no PyPI publish yet; until it
# does, the lock resolves it from the public repo at the release commit — the
# phase 7 arrangement, swapped for the plain PyPI range when 1.4.0 publishes.
[tool.uv.sources]
osrlib = { git = "https://github.com/mmacy/osrlib-python", rev = "13157bdc75948017d4146491da8ff42d9f6e6d28" }

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

# uv_build packages the tree, not the git index: with the frontend built, the
# gitignored src/osreditor/static/ ships in both artifacts by design — and so
# would any junk sitting in the tree. These excludes fix the leak at the
# source; uv_build silently ignores unknown keys here (a typo'd exclude builds
# clean and excludes nothing), so the dist audit's forbidden-member sweep
# (scripts/release/check_dist.py) is the guard that would ever notice.
[tool.uv.build-backend]
module-name = "osreditor"
source-exclude = ["**/.DS_Store", "**/Thumbs.db", "**/.AppleDouble", "**/__pycache__"]
wheel-exclude = ["**/.DS_Store", "**/Thumbs.db", "**/.AppleDouble", "**/__pycache__"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "UP", "B", "SIM", "RUF"]
ignore = [
    "D105", # missing docstring in magic method — __str__ and friends are self-evident
]
# Intentional module notation, not confusable typos: the multiplication sign
# ("5 × acolyte", matching the frontend) and the en dash osrlib's save-band
# labels print ("1–3").
allowed-confusables = ["×", "–"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["osreditor"]

[tool.pyright]
pythonVersion = "3.14"
include = ["src", "tests", "scripts"]
typeCheckingMode = "standard"
strict = ["src"]

# Tests import sibling helper modules bare (osrlib's pattern: `from test_documents
# import ...` in generator scripts); pytest and direct script runs both put tests/
# on sys.path, so pyright mirrors that here.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
